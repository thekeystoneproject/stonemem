name: stonemem
version: 1.0.0
description: Institutional memory engine for Hermes agents — structured recall, entity graphs, temporal scoring
author: Blink Authority, Inc.
license: MIT
dependencies:
  - httpx>=0.27
memory_provider: stonemem
config:
  STONEMEM_URL:
    default: "http://127.0.0.1:3391"
    description: "stonemem server URL"
  STONEMEM_AGENT_ID:
    default: null
    description: "Agent ID (auto-detected from profile if unset)"
  STONEMEM_AUTO_START:
    default: true
    description: "Auto-start stonemem binary if not running"
